name: CI Pipeline — Attendance SaaS

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check services/ packages/ tests/

      - name: Run Mypy Type Checker
        run: |
          mypy services/api/

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Celery Worker Smoke Test
        run: |
          python services/workers/smoke_test.py

      - name: Run Database Safe Check Smoke
        run: |
          python services/api/verify_db.py || true

  security-scans:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt || true
