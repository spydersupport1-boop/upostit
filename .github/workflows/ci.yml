name: CI Pipeline — Attendance SaaS

on:
  push:
    branches: [main, web, mobile]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: upostit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check services/ packages/ tests/

      - name: Run Mypy Type Checker
        run: |
          mypy services/api/

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/upostit_test
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-required
          ENVIRONMENT: testing
        run: |
          pytest tests/ -v

      - name: Run Celery Worker Smoke Test
        run: |
          python services/workers/smoke_test.py

      - name: Run Database Safe Check Smoke
        run: |
          python services/api/verify_db.py || true

  web-checks:
    name: Web App Lint, Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Build Web Application
        run: npm run build

  mobile-checks:
    name: Flutter Mobile Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Mobile Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test

  security-scans:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt || true
