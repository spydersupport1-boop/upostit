# ==============================================================================
# Attendance SaaS — Supporting Local Infrastructure
# Only Redis and MinIO are run locally; Supabase is the primary PostgreSQL database.
# ==============================================================================

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: attendance_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-placeholder_access_key}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-placeholder_secret_key}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
